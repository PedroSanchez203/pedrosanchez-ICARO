  <!-- Bootstrap Icons -->

  <!-- Custom CSS -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg fixed-top navbar-custom navbar-dark">

      <a class="navbar-brand navbar-brand-logo d-flex align-items-center" href="index.html">

        <svg class="flag-icon ms-2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="24" height="18">
          <rect width="640" height="480" fill="#74acdf"/>
          <rect width="640" height="160" y="160" fill="#fff"/>
          <circle cx="320" cy="240" r="30" fill="#f6b40e"/>
        </svg>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" 
              aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">

            <a class="nav-link nav-link-custom" href="index.html">INICIO</a>
          </li>
          <li class="nav-item">
            <a class="nav-link nav-link-custom" href="carreras.html">CARRERAS</a>

          <li class="nav-item">
            <a class="nav-link nav-link-custom active" aria-current="page" href="contacto.html">CONTACTO</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- CONTENT -->
  <main class="container py-5" style="margin-top: 100px; min-height: 70vh;">
    <header class="text-center my-4 accent-line-center">
      <span class="text-primary text-uppercase fw-bold letter-spacing fs-7">PONETE EN CONTACTO</span>
      <h1 class="display-5 fw-bold text-dark mt-1">Contacto</h1>
    </header>

    <div class="row justify-content-center mt-5">
      <div class="col-lg-8 col-xl-6">
        <article class="card border-0 shadow-sm rounded-4 overflow-hidden mb-4">
          <div class="card-body p-5">
            <h4 class="fw-bold text-dark mb-4 text-center"><i class="bi bi-envelope text-primary me-2"></i>Envianos tu mensaje</h4>
            
            <form action="#" method="POST">
              <!-- Nombre -->
              <div class="mb-3">
                <label for="nombre" class="form-label fw-bold text-secondary">Nombre Completo</label>
                <div class="input-group">
                  <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-person"></i></span>
                  <input type="text" class="form-control border-start-0 ps-0" id="nombre" name="nombre" placeholder="Juan Pérez" required>
                </div>
              </div>
              
              <!-- Correo electrónico -->
              <div class="mb-3">
                <label for="email" class="form-label fw-bold text-secondary">Correo Electrónico</label>
                <div class="input-group">
                  <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                  <input type="email" class="form-control border-start-0 ps-0" id="email" name="email" placeholder="juan@ejemplo.com" required>
                </div>
              </div>
              
              <!-- Mensaje -->
              <div class="mb-4">
                <label for="mensaje" class="form-label fw-bold text-secondary">Mensaje</label>
                <div class="input-group">
                  <span class="input-group-text bg-white border-end-0 text-muted align-items-start pt-2"><i class="bi bi-chat-text"></i></span>
                  <textarea class="form-control border-start-0 ps-0" id="mensaje" name="mensaje" rows="5" placeholder="Escribí tu mensaje o consulta acá..." required></textarea>
                </div>
              </div>
              
              <!-- Botón de Envío -->
              <button type="submit" class="btn custom-btn-primary w-100 fw-bold py-3 text-uppercase">Enviar Mensaje</button>
            </form>
            
          </div>
        </article>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="footer-custom text-center">
    <div class="container">
      <a class="footer-brand d-inline-flex align-items-center text-decoration-none mb-3" href="index.html">
        <span>FC43</span>
        <svg class="flag-icon ms-2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="24" height="18">
          <rect width="640" height="480" fill="#74acdf"/>
          <rect width="640" height="160" y="160" fill="#fff"/>
          <circle cx="320" cy="240" r="30" fill="#f6b40e"/>
        </svg>
      </a>
      <p class="footer-text mb-1">Proyecto homenaje a Franco Colapinto.</p>
      <p class="footer-text mb-4">Hecho con HTML, CSS y Bootstrap.</p>
      <div class="d-flex justify-content-center align-items-center gap-3">
        <a href="https://instagram.com" target="_blank" class="social-icon-link" aria-label="Instagram"><i class="bi bi-instagram"></i></a>
        <a href="https://twitter.com" target="_blank" class="social-icon-link" aria-label="Twitter"><i class="bi bi-twitter-x"></i></a>
        <a href="https://youtube.com" target="_blank" class="social-icon-link" aria-label="YouTube"><i class="bi bi-youtube"></i></a>
        <a href="https://tiktok.com" target="_blank" class="social-icon-link" aria-label="TikTok"><i class="bi bi-tiktok"></i></a>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

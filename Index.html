<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trabajo Final - Módulo 2</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
</head>
<body class="bg-light">

  <div class="container py-5">
    <div class="text-center mb-5">
      <h1 class="display-6 fw-bold">Trabajo Final: Módulo 2</h1>
    </div>

    <section id="tareas" class="mb-5">
      <div class="row">
        <div class="col-lg-5 mb-4">
          <div class="card shadow-sm p-4">
            <h2 class="h4 mb-3 text-primary">Gestor de Tareas</h2>

            <div class="mb-3">
              <label for="nombreTarea" class="form-label">Nombre de la tarea</label>
              <input
                type="text"
                class="form-control"
                id="nombreTarea"
                placeholder="Ej: Estudiar funciones"
              >
            </div>

            <div class="mb-3">
              <label for="prioridadTarea" class="form-label">Prioridad</label>
              <select class="form-select" id="prioridadTarea">
                <option value="Baja">Baja</option>
                <option value="Media" selected>Media</option>
                <option value="Alta">Alta</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="fechaVencimiento" class="form-label">Fecha de vencimiento</label>
              <input type="date" class="form-control" id="fechaVencimiento">
            </div>

            <button class="btn btn-primary w-100" id="agregarTarea">
              Agregar Tarea
            </button>
          </div>
        </div>

        <div class="col-lg-7">
          <div class="card shadow-sm p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h2 class="h4 mb-0 text-secondary">Mis Tareas</h2>
              <span class="badge bg-info text-dark" id="tareasPendientes">
                Tareas pendientes: 0
              </span>
            </div>
            <ul class="list-group" id="listadoTareas"></ul>
          </div>
        </div>
      </div>
    </section>

    <hr class="my-5 text-muted">

    <section id="calculadora" class="mb-5">
      <div class="text-center mb-4">
        <h2 class="h4 text-primary">Calculadora Aritmética</h2>
      </div>

      <div class="card shadow-sm p-4 mx-auto" style="max-width: 360px;">
        <input
          type="text"
          id="calcDisplay"
          class="form-control text-end fs-2 font-monospace mb-3 bg-dark text-white border-0 py-3"
          value="0"
          readonly
        >

        <div class="row g-2">
          <div class="col-3">
            <button class="btn btn-danger w-100 py-3 fs-5 fw-bold calc-btn" data-tipo="limpiar">C</button>
          </div>
          <div class="col-3">
            <button class="btn btn-warning w-100 py-3 fs-5 fw-bold calc-btn text-dark" data-tipo="borrar">DEL</button>
          </div>
          <div class="col-3">
            <button class="btn btn-primary w-100 py-3 fs-5 fw-bold calc-btn" data-tipo="operador" data-valor="/">÷</button>
          </div>
          <div class="col-3">
            <button class="btn btn-primary w-100 py-3 fs-5 fw-bold calc-btn" data-tipo="operador" data-valor="*">×</button>
          </div>

          <div class="col-3">
            <button class="btn btn-light w-100 py-3 fs-5 fw-bold calc-btn border" data-tipo="numero" data-valor="7">7</button>
          </div>
          <div class="col-3">
            <button class="btn btn-light w-100 py-3 fs-5 fw-bold calc-btn border" data-tipo="numero" data-valor="8">8</button>
          </div>
          <div class="col-3">
            <button class="btn btn-light w-100 py-3 fs-5 fw-bold calc-btn border" data-tipo="numero" data-valor="9">9</button>
          </div>
          <div class="col-3">
            <button class="btn btn-primary w-100 py-3 fs-5 fw-bold calc-btn" data-tipo="operador" data-valor="-">-</button>
          </div>

          <div class="col-3">
            <button class="btn btn-light w-100 py-3 fs-5 fw-bold calc-btn border" data-tipo="numero" data-valor="4">4</button>
          </div>
          <div class="col-3">
            <button class="btn btn-light w-100 py-3 fs-5 fw-bold calc-btn border" data-tipo="numero" data-valor="5">5</button>
          </div>
          <div class="col-3">
            <button class="btn btn-light w-100 py-3 fs-5 fw-bold calc-btn border" data-tipo="numero" data-valor="6">6</button>
          </div>
          <div class="col-3">
            <button class="btn btn-primary w-100 py-3 fs-5 fw-bold calc-btn" data-tipo="operador" data-valor="+">+</button>
          </div>

          <div class="col-3">
            <button class="btn btn-light w-100 py-3 fs-5 fw-bold calc-btn border" data-tipo="numero" data-valor="1">1</button>
          </div>
          <div class="col-3">
            <button class="btn btn-light w-100 py-3 fs-5 fw-bold calc-btn border" data-tipo="numero" data-valor="2">2</button>
          </div>
          <div class="col-3">
            <button class="btn btn-light w-100 py-3 fs-5 fw-bold calc-btn border" data-tipo="numero" data-valor="3">3</button>
          </div>
          <div class="col-3">
            <button class="btn btn-light w-100 py-3 fs-5 fw-bold calc-btn border" data-tipo="numero" data-valor=".">.</button>
          </div>

          <div class="col-6">
            <button class="btn btn-light w-100 py-3 fs-5 fw-bold calc-btn border" data-tipo="numero" data-valor="0">0</button>
          </div>
          <div class="col-6">
            <button class="btn btn-success w-100 py-3 fs-5 fw-bold calc-btn" data-tipo="igual">=</button>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
